name: Sync AUR haven-desktop-git

on:
    push:
        branches: [develop]

jobs:
    sync-aur:
        name: Refresh haven-desktop-git .SRCINFO
        runs-on: ubuntu-latest
        container: archlinux:base-devel
        steps:
            # Full upgrade, not a partial `pacman -Sy git openssh` - a partial sync can pull in a
            # newer glibc than whatever this container image already has for other packages,
            # leaving mismatched shared libraries (confirmed live doing exactly this on a real
            # machine while setting this whole AUR packaging effort up: a plain `pacman -Sy nodejs`
            # left `node` needing a newer GLIBC_2.44 than the system's own still-2.43 libm/libc).
            - name: Full system upgrade, then install git/openssh
              run: pacman -Syu --noconfirm --needed git openssh

            # makepkg refuses to run as root at all.
            - name: Create an unprivileged build user
              run: |
                  useradd -m -s /bin/bash builder
                  chown -R builder:builder /home/builder

            - name: Configure SSH access to the AUR
              env:
                  AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
              run: |
                  mkdir -p /home/builder/.ssh
                  printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/aur
                  chmod 600 /home/builder/.ssh/aur
                  ssh-keyscan -t ed25519 aur.archlinux.org >> /home/builder/.ssh/known_hosts
                  cat > /home/builder/.ssh/config <<'EOF'
                  Host aur.archlinux.org
                      IdentityFile /home/builder/.ssh/aur
                      User aur
                  EOF
                  chmod 600 /home/builder/.ssh/config
                  chown -R builder:builder /home/builder/.ssh

            # Written as a real script file run via a simple path argument, not an inline
            # `su builder -c '...multi-line string...'` - the previous version of this workflow
            # failed with "sed: can't read PKGBUILD: No such file or directory" partway through
            # for a reason that was never fully pinned down (never reproduced locally outside
            # this container), and a single quoted multi-command string passed through `su -c`
            # is much harder to debug blind than a real script with -x tracing. This form also
            # sidesteps any quoting ambiguity between the outer YAML block and the inner script.
            - name: Write the sync script
              run: |
                  cat > /home/builder/sync-aur.sh <<'SCRIPT'
                  #!/bin/bash
                  set -ex
                  cd /home/builder
                  git clone ssh://aur@aur.archlinux.org/haven-desktop-git.git
                  cd haven-desktop-git
                  pwd
                  ls -la

                  # "makepkg --printsrcinfo" never actually runs pkgver() at all - confirmed live
                  # it just dumps whatever static pkgver= is already written in the PKGBUILD,
                  # completely ignoring both the real upstream commit and anything already
                  # sitting in src/. The only thing that runs pkgver() for real is a full
                  # makepkg -o/-f, which also drags in this PKGBUILD's own prepare() (installs
                  # its own pinned yarn/pnpm via npm) purely to compute a version string -
                  # confirmed live that failed outright here with a bare "npm: command not
                  # found", since only git/openssh are installed in this container. Compute the
                  # same version pkgver() would with plain git instead, and just write it into
                  # PKGBUILD directly - avoids needing any of this project's own build toolchain
                  # just to refresh a version string.
                  git clone --branch develop https://github.com/Haven-Organization/haven-desktop.git /home/builder/src-check
                  NEW_PKGVER=$(git -C /home/builder/src-check describe --tags --long | sed "s/^haven-v//;s/\([^-]*-g\)/r\1/;s/-/./g")
                  echo "NEW_PKGVER=$NEW_PKGVER"
                  rm -rf /home/builder/src-check
                  pwd
                  sed -i "s/^pkgver=.*/pkgver=$NEW_PKGVER/" PKGBUILD
                  makepkg --printsrcinfo > .SRCINFO.new

                  if diff -q .SRCINFO .SRCINFO.new > /dev/null; then
                      echo "pkgver already up to date, nothing to push"
                      exit 0
                  fi

                  mv .SRCINFO.new .SRCINFO
                  git config user.name "Haven CI"
                  git config user.email "havensoftware@zohomail.com"
                  git add PKGBUILD .SRCINFO
                  git commit -m "Refresh pkgver to match latest develop commit"
                  git push
                  SCRIPT
                  chmod +x /home/builder/sync-aur.sh
                  chown builder:builder /home/builder/sync-aur.sh

            - name: Run the sync script as an unprivileged user
              run: su builder -c /home/builder/sync-aur.sh
