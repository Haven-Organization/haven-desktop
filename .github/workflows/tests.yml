name: Tests

on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop]

jobs:
    test:
        name: Type-check and unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Enable corepack
              run: corepack enable

            # This monorepo's globally-resolved pnpm can drift ahead of the exact version pinned in
            # devEngines.packageManager (see the "Fresh-clone pnpm pin fix" project history) and
            # `~/package.json`-level packageManager fields have been known to fight corepack here too
            # - these three env vars are the project's own established workaround, not a new one.
            - name: Install dependencies
              working-directory: element-web
              env:
                  CI: "true"
                  COREPACK_ENABLE_STRICT: "0"
                  PNPM_CONFIG_PM_ON_FAIL: ignore
                  npm_config_pm_on_fail: ignore
              run: pnpm install --frozen-lockfile

            # src/apps/social lives at the repo root (a sibling of element-web/, not inside it - see
            # vitest.config.ts's own comment on this), and resolves its own dependencies (e.g.
            # matrix-js-sdk) via plain Node module resolution walking up from its own location -
            # which only finds anything if a node_modules symlink exists at the repo root pointing
            # into element-web's own. Nothing else creates this (it's gitignored, and setup.sh
            # doesn't make it either), so a fresh checkout is missing it entirely and any vitest run
            # that even glob-matches a src/apps/**/*.test.ts file (which vitest.config.ts's own
            # `include` always does, regardless of which specific files are passed on the CLI) fails
            # outright trying to resolve matrix-js-sdk from that directory.
            - name: Link repo-root node_modules for src/apps
              run: ln -s element-web/apps/web/node_modules node_modules

            # apps/web imports @element-hq/web-shared-components and @element-hq/element-web-module-api
            # as built packages (their dist/lib output, not raw src) - without this, both the
            # type-check below and apps/web's own vitest run fail outright with "Cannot find module".
            # packages/playwright-common and packages/shared-types have no build target (consumed
            # directly from source) so don't need this.
            # shared-utils is a new upstream package (sanitize-html and friends, split out of apps/web) that
            # apps/web and shared-components both import as a built package too.
            - name: Build shared-utils
              working-directory: element-web/packages/shared-utils
              run: npx vite build

            - name: Build shared-components
              working-directory: element-web/packages/shared-components
              run: npx vite build

            - name: Build module-api
              working-directory: element-web/packages/module-api
              run: npx vite build

            # Non-blocking: apps/web pins matrix-js-sdk to the live github:matrix-org/matrix-js-sdk#develop
            # branch (not a stable release), so type-check can fail on whatever's currently on ITS
            # develop tip - unrelated to Haven's own code and outside this repo's control. Still
            # reported as an annotation on the run, just doesn't fail the job.
            - name: Type-check (apps/web)
              working-directory: element-web/apps/web
              continue-on-error: true
              env:
                  COREPACK_ENABLE_STRICT: "0"
                  PNPM_CONFIG_PM_ON_FAIL: ignore
                  npm_config_pm_on_fail: ignore
              run: pnpm exec tsc --noEmit

            # Scoped intentionally: this repo's full historical test suites have substantial
            # pre-existing failures unrelated to Haven's own code (165 failing legacy jest tests, and
            # a fresh-checkout-only module resolution issue that crashes most of the wider vitest
            # suite) - tracked separately, not something to hard-gate on yet. This list is every
            # Haven-authored/extended test file added for emoji-picker/reactions/room-list coverage,
            # plus the pre-send DM encryption toggle, highlighted-event scroll anchoring, the removed
            # video error overlay, the gun emoji fonts + style/skin tone settings, and Social/framework's own
            # src/apps tests (repo-root, picked up via vitest.config.ts's own include) - each
            # individually verified green - a real, reliable regression gate for the features
            # most likely to break in an upstream merge, without pretending the rest of the suite is
            # healthy when it isn't.
            - name: Unit tests - vitest (Haven feature coverage, apps/web)
              working-directory: element-web/apps/web
              run: >
                  npx vitest run --retry 2
                  src/HtmlUtils.test.ts
                  src/createRoom.test.ts
                  src/accessibility/Toolbar.test.tsx
                  src/autocomplete/EmojiProvider.skinTone.test.ts
                  src/components/structures/LocalRoomView.test.tsx
                  src/components/structures/ScrollPanel.test.tsx
                  src/components/views/context_menus/MessageContextMenu.test.tsx
                  src/components/views/dialogs/AddToPackDialog.test.tsx
                  src/components/views/dialogs/FindPackDialog.test.tsx
                  src/components/views/dialogs/ReactionsDialog.test.tsx
                  src/components/views/emojipicker/ReactionPicker.test.tsx
                  src/components/views/emojipicker/customEmoji.test.ts
                  src/components/views/rooms/EmojiButton.test.tsx
                  src/components/views/rooms/EventTile/ActionBarAdapter.test.tsx
                  src/components/views/rooms/EventTile/ReactionsRowAdapter.test.tsx
                  src/components/views/settings/EmojiPreferenceSwitchers.test.tsx
                  src/components/views/settings/emojistickers/PackEditor.test.tsx
                  src/components/views/settings/tabs/room/EmojiStickersRoomSettingsTab.test.tsx
                  src/emojipicker/HavenEmojiPicker.test.tsx
                  src/emojipicker/useEmojiSkinTone.test.tsx
                  src/legacy-room-list
                  src/models/LocalRoom.test.ts
                  src/settings/controllers/SystemFontController.test.ts
                  src/settings/havenBackdropBlur.test.ts
                  src/settings/havenEmojiSettings.test.ts
                  src/settings/watchers/FontWatcher.test.ts
                  src/settings/watchers/RoomListBackdropWatcher.test.ts
                  src/stores/right-panel/RightPanelStore.test.ts
                  src/stores/room-list-v3/RoomListStoreV3.test.ts
                  src/stores/room-list-v3/skip-list/filters/UnreadFilter.test.ts
                  src/utils/ImagePacks.test.ts
                  src/utils/direct-messages.test.ts
                  src/utils/dm/startDm.test.ts
                  src/utils/havenPistolEmojiFont.test.ts
                  src/utils/imageSourcePacks.test.ts
                  src/utils/pendingManagePack.test.ts
                  src/viewmodels/message-body/VideoBodyViewModel.test.ts
                  src/viewmodels/room-list/RoomListViewModel.test.ts
                  src/viewmodels/room/timeline/event-tile/body/TextualBodyViewModel.test.ts
                  src/viewmodels/room/timeline/event-tile/reactions/ReactionsRowButtonTooltipViewModel.test.ts
                  src/viewmodels/room/timeline/event-tile/reactions/ReactionsRowButtonViewModel.test.ts
                  src/apps

            # RoomView.test.tsx as a whole has pre-existing failures unrelated to Haven (stale header
            # tooltip snapshots on ordinary, non-local rooms), so it can't be gated on wholesale - only
            # its "for a local room" block, which is where Haven's pre-send DM encryption toggle is
            # covered (see LocalRoomView in RoomView.tsx).
            - name: Unit tests - vitest (Haven DM encryption toggle, apps/web)
              working-directory: element-web/apps/web
              run: npx vitest run --retry 2 src/components/structures/RoomView.test.tsx -t "for a local room"

            # electron-builder.ts is upstream-owned; this is what notices a merge dropping Haven's
            # AppImage settings (static runtime so it runs without libfuse2, and the hook that embeds
            # update information + generates the .zsync) - see scripts/appimage-update-info.ts.
            - name: Unit tests - vitest (Haven AppImage build, apps/desktop)
              working-directory: element-web/apps/desktop
              run: npx vitest run src/appimage-update-info.test.ts

            # shared-components' "unit" vitest project renders through a real browser (chromium via
            # Playwright), not happy-dom/jsdom - needs its browser binary installed first.
            - name: Install Playwright browser
              working-directory: element-web/packages/shared-components
              run: npx playwright install --with-deps chromium

            - name: Unit tests - vitest (Haven feature coverage, shared-components)
              working-directory: element-web/packages/shared-components
              run: >
                  npx vitest run
                  src/core/EmojiPicker/EmojiPicker.test.tsx
                  src/core/EmojiPicker/EmojiPicker.skinTone.test.tsx
                  src/core/EmojiPicker/skinTone.test.ts
                  src/room/timeline/event-tile/body/MVideoBodyView/VideoBodyView.test.tsx
                  src/room/timeline/event-tile/reactions/ReactionsRowButton/ReactionsRowButton.test.tsx

            # Runs last and reverts branding in place, since HAVEN_NO_BRANDING touches
            # webpack.config.ts/SdkConfig.ts/electron-builder.ts/etc. for the rest of this checkout -
            # nothing after this step may assume Haven's own branding is still there. Exercises
            # setup.sh's own revert (see its own extensive comments on why - a whole-file revert to a
            # year-old commit can reintroduce imports of things upstream has since deleted, exactly
            # what broke the real "glowers element" unbranded build outright after the 2026-09-21
            # upstream sync, undetected until someone tried to build it) and that the reverted tree
            # still actually compiles, rather than only checking the revert script itself runs. A
            # type-check is a cheap stand-in for a full webpack build (which nothing in this workflow
            # does even for Haven's own branding) - it still catches a config file whose own imports
            # don't resolve, the exact failure mode this exists to guard.
            - name: Unbranded build stays buildable (HAVEN_NO_BRANDING)
              env:
                  COREPACK_ENABLE_STRICT: "0"
                  PNPM_CONFIG_PM_ON_FAIL: ignore
                  npm_config_pm_on_fail: ignore
                  HAVEN_NO_BRANDING: "1"
              run: |
                  ./scripts/setup.sh
                  cd element-web/apps/web
                  pnpm exec tsc --noEmit
