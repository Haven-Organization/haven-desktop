<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Fitted to the real original icon's actual pixels (quadratic regression per channel
         against every real background pixel, R^2 ~0.97 on the green channel) rather than
         guessed - the true highlight sits inset from the top-right corner, not a flat corner-
         to-corner blend, which a plain 2-stop linearGradient could not reproduce. -->
    <radialGradient id="bg" cx="92%" cy="0%" r="130%">
      <stop offset="0%" stop-color="#5bd699"/>
      <stop offset="100%" stop-color="#105c64"/>
    </radialGradient>
  </defs>
  <!-- Inset background plate at 82% of the canvas, centered, leaving transparent margin to the
       edge - Flathub's own icon-grid template (docs.flathub.org/img/app-icon-grid.svg) defines a
       centered rounded-square reference at ~80.5% of canvas width for exactly this reason: their
       app icon guidelines explicitly say to avoid the icon touching the edges of the canvas. -->
  <rect x="92" y="92" width="839" height="839" fill="url(#bg)"/>
  <g transform="translate(314.974,271.360) scale(1.003032)">
