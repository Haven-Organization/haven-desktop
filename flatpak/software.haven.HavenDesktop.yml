app-id: software.haven.HavenDesktop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: haven-desktop
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable

finish-args:
  - --socket=fallback-x11
  - --share=ipc
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.ScreenSaver
  - --filesystem=xdg-run/keyring
  - --talk-name=org.freedesktop.secrets
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=com.canonical.Unity

modules:
  - name: haven-desktop
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/run/build/haven-desktop/pnpm-cli/bin
      env:
        XDG_CACHE_HOME: /run/build/haven-desktop/flatpak-node/cache
        PNPM_HOME: /run/build/haven-desktop/flatpak-node/pnpm-home
        HOME: /run/build/haven-desktop
        COREPACK_ENABLE_STRICT: '0'
        PNPM_CONFIG_PM_ON_FAIL: ignore
        npm_config_pm_on_fail: ignore
        NX_NO_CLOUD: 'true'
        NX_SKIP_NX_CACHE: 'true'
        NX_DAEMON: 'false'
    build-commands:
      - bash flatpak/build.sh
    sources:
      # Haven: builds the current checkout directly (this manifest already lives inside the repo
      # it builds), rather than a `type: git` fetch of a specific published tag/commit the way the
      # Flathub submission's own copy of this manifest does - that's the right call for Flathub
      # (a reproducible build must fetch a real, citable release, not a build machine's local
      # working tree), but would only add friction here: testing a flatpak build of work still on
      # this branch shouldn't require tagging and pushing a release first. `.git` is NOT skipped
      # (confirmed live, 2026-09-04) despite looking like harmless VCS metadata to drop - build.sh's
      # own compute-haven-version.sh needs a real, real `git log --merges`-capable repository to
      # compute HAVEN_FULL_VERSION; without it, `git -C "$ROOT_DIR" log ...` fails outright with
      # "fatal: not a git repository" (exit 128, silently swallowed by that script's own `2>/dev/null`
      # then re-surfaced by `set -e`), aborting the whole build with no error message at all - a much
      # harder failure than the shallow-clone/no-merge-commit case that script already falls back on
      # gracefully. Skips only things that would otherwise bloat/break the build sandbox copy -
      # installed node_modules (platform/host-specific, pnpm reinstalls from the offline store below
      # anyway) and any previous build output.
      - type: dir
        path: ..
        skip:
          - "**/node_modules"
          - element-web/apps/web/dist
          - element-web/apps/web/webapp
          - element-web/apps/desktop/dist
      - generated-sources.json
      # Element Call's source and the packages its component build needs - see build.sh.
      - element-call-sources.json
      - type: script
        dest: pnpm-cli/bin
        dest-filename: pnpm
        commands:
          - "#!/bin/sh"
          - exec /run/build/haven-desktop/pnpm-cli/package/pnpm "$@"
      # pnpm 12's npm package is a wrapper that downloads its native binary on first use, which can't
      # happen offline. build.sh puts this architecture's binary in place of the wrapper's placeholder,
      # next to the dist/ payload it needs, the same way pnpm's own install.js does.
      - type: file
        url: https://registry.npmjs.org/pnpm/-/pnpm-12.14.0.tgz
        sha256: ea206e35474bf87be9564a85ca70ed1c8ebdc45da55aafb0a3bf09d1ba69b179
        dest-filename: pnpm-12.14.0.tgz
      - type: file
        only-arches: [x86_64]
        url: https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.14.0.tgz
        sha256: 1de98ed2e9621113b0887b06322b461efb9df73d913fc1d151039b10b7117a41
        dest-filename: pnpm-exe-12.14.0.tgz
      - type: file
        only-arches: [aarch64]
        url: https://registry.npmjs.org/@pnpm/exe.linux-arm64/-/exe.linux-arm64-12.14.0.tgz
        sha256: e7ca24224eb626a032828ec584c67903ad2f389911b849d009ed70a19f70d8d3
        dest-filename: pnpm-exe-12.14.0.tgz
      # Ruffle, the Flash player, for Flash games (HAVEN_RUFFLE, see scripts/fetch-ruffle.mjs). Same
      # package scripts/fetch-ruffle.mjs downloads for HAVEN_RUFFLE=latest; build.sh unpacks it from here.
      - type: file
        url: https://registry.npmjs.org/@ruffle-rs/ruffle/-/ruffle-0.7.1.tgz
        sha256: dc9e7407549a91accc41a14932b0b9d9a9d51a3742ce6f020888c8a76682b157
        dest-filename: ruffle-0.7.1.tgz
      # matrix-seshat's Rust crates, vendored for the offline `cargo build` in build.sh (generated from
      # matrix-seshat-Cargo.lock with flatpak-cargo-generator; the crate itself is the @matrix-org/seshat
      # package pnpm installs).
      - matrix-seshat-cargo-sources.json
